name: CI

# The solver had no workflow while it lived in the testsAndMisc monorepo: its
# only automation was a local systemd unit calling deploy_build.sh. Extraction
# is the moment it gets real CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json's `packageManager` field is the
      # single source of truth, and a second pin drifts from it silently.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
