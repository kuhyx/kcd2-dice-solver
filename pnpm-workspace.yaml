# pnpm 10 reads both of these from here; the old package.json "pnpm" field is
# ignored outright (it warns and moves on), so this file is the only place they
# take effect.

# esbuild ships a postinstall that fetches its platform binary. Without an
# explicit approval pnpm refuses to run it and `pnpm install` exits non-zero.
allowBuilds:
  esbuild: true

# deploy_build.sh runs from a systemd unit, which has no TTY. pnpm 11 needed
# `confirmModulesPurge: false` here or it aborted rather than reinstall an
# existing node_modules; pnpm 12 removed the setting (and rejects it as
# unrecognized) -- an install over an existing node_modules with stdin closed
# was verified to complete on the 12.4.2 bump.
